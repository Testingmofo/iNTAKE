name: Build iNTAKE 0.2.6 Beta

on:
  push:
    branches:
      - release/v0.2.6-beta

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install release packaging tools
        shell: powershell
        run: choco install maven wixtoolset deno yt-dlp ffmpeg --yes --no-progress

      - name: Build portable package and installer
        shell: powershell
        run: ./scripts/Build-Release.ps1

      - name: Publish beta release and assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath 'For-Release' -File | Sort-Object Name | ForEach-Object FullName)
          if ($assets.Count -lt 6) {
            throw "Expected all six release files, found $($assets.Count)."
          }
          $tag = 'v0.2.6-beta'
          $title = 'iNTAKE v0.2.6 Beta'
          $arguments = @(
            'release', 'create', $tag,
            '--repo', $env:GITHUB_REPOSITORY,
            '--target', $env:GITHUB_SHA,
            '--prerelease',
            '--title', $title,
            '--notes-file', 'release/RELEASE-NOTES-v0.2.6-beta.md'
          ) + $assets
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation failed with exit code $LASTEXITCODE."
          }

